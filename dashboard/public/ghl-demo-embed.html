<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plumbify Product Tour Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #070913; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 20px; }
        .demo-container { max-width: 1000px; margin: 0 auto; background: linear-gradient(180deg, #121526 0%, #0a0c16 100%); border: 1px solid #1e293b; border-radius: 24px; padding: 24px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); }
        .header { text-align: center; margin-bottom: 24px; }
        .tag { display: inline-block; background: rgba(6, 182, 212, 0.1); border: 1px solid rgba(6, 182, 212, 0.3); color: #22d3ee; font-size: 12px; font-weight: bold; padding: 4px 12px; border-radius: 20px; margin-bottom: 12px; }
        .title { font-size: 28px; font-weight: 900; color: #fff; line-height: 1.3; }
        .lang-switch { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
        .btn-lang { background: #070914; border: 1px solid #334155; color: #94a3b8; font-size: 13px; font-weight: bold; padding: 8px 16px; border-radius: 10px; cursor: pointer; transition: all 0.2s; }
        .btn-lang.active { background: #4f46e5; border-color: #6366f1; color: #fff; box-shadow: 0 4px 12px rgba(79, 70, 229, 0.4); }
        .video-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 16px; overflow: hidden; border: 1px solid #334155; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .chapter-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 20px; }
        .btn-chapter { background: #0b0d18; border: 1px solid #1e293b; color: #94a3b8; padding: 10px; border-radius: 12px; text-align: left; cursor: pointer; transition: all 0.2s; font-size: 11px; }
        .btn-chapter:hover { border-color: #38bdf8; color: #fff; background: #131728; }
        .btn-chapter strong { display: block; color: #e2e8f0; font-size: 12px; margin-bottom: 2px; }
        .cta-box { margin-top: 32px; background: linear-gradient(90deg, rgba(79,70,229,0.2) 0%, rgba(6,182,212,0.2) 100%); border: 1px solid rgba(99,102,241,0.3); border-radius: 20px; padding: 24px; text-align: center; }
        .btn-cta { display: inline-block; background: linear-gradient(90deg, #4f46e5 0%, #06b6d4 100%); color: #fff; font-weight: bold; text-decoration: none; padding: 12px 28px; border-radius: 12px; font-size: 14px; margin-top: 12px; box-shadow: 0 10px 25px rgba(79, 70, 229, 0.4); }
    </style>
</head>
<body>

<div class="demo-container">
    <div class="header">
        <span class="tag">🎉 Welcome to Plumbify</span>
        <h1 class="title">See Plumbify In Action: 2-Minute AI Dispatch Walkthrough</h1>
    </div>

    <div class="lang-switch">
        <span style="font-size:13px; font-weight:bold; color:#cbd5e1;">Select Audio Language:</span>
        <div>
            <button class="btn-lang active" id="btn-en" onclick="switchLanguage('en')">🇺🇸 English Voiceover</button>
            <button class="btn-lang" id="btn-zh" onclick="switchLanguage('zh')">🇨🇳 中文解说</button>
        </div>
    </div>

    <div class="video-wrapper">
        <video id="demoVideo" controls playsinline src="https://dashboard.plumbify.net/videos/CleanShot_Plumbify_Dashboard_Voiceover_EN.mp4"></video>
    </div>

    <div class="chapter-grid">
        <button class="btn-chapter" onclick="seekVideo(0)">
            <strong>0:00 Overview</strong>
            Bento Console
        </button>
        <button class="btn-chapter" onclick="seekVideo(23)">
            <strong>0:23 Pipeline</strong>
            Work Orders
        </button>
        <button class="btn-chapter" onclick="seekVideo(45)">
            <strong>0:45 Voice AI</strong>
            24/7 Call Radar
        </button>
        <button class="btn-chapter" onclick="seekVideo(68)">
            <strong>1:08 GPS Route</strong>
            Plumber Trajectory
        </button>
        <button class="btn-chapter" onclick="seekVideo(90)">
            <strong>1:31 Transcripts</strong>
            Audio Playback
        </button>
        <button class="btn-chapter" onclick="seekVideo(112)">
            <strong>1:53 Webhook</strong>
            30s Integration
        </button>
    </div>

    <div class="cta-box">
        <h3 style="color:#fff; font-size:18px; margin-bottom:6px;">Ready to Automate Your Plumbing Business?</h3>
        <p style="color:#94a3b8; font-size:12px;">Experience live AI call handling and real-time technician GPS tracking.</p>
        <a href="https://dashboard.plumbify.net/dashboard" class="btn-cta" target="_blank">Try Live Interactive Dashboard 🚀</a>
    </div>
</div>

<script>
    const video = document.getElementById('demoVideo');
    const btnEn = document.getElementById('btn-en');
    const btnZh = document.getElementById('btn-zh');

    const srcEN = "https://dashboard.plumbify.net/videos/CleanShot_Plumbify_Dashboard_Voiceover_EN.mp4";
    const srcZH = "https://dashboard.plumbify.net/videos/CleanShot_Plumbify_Dashboard_Voiceover_ZH.mp4";

    function switchLanguage(lang) {
        const currentTime = video.currentTime;
        const isPlaying = !video.paused;

        if (lang === 'en') {
            video.src = srcEN;
            btnEn.classList.add('active');
            btnZh.classList.remove('active');
        } else {
            video.src = srcZH;
            btnZh.classList.add('active');
            btnEn.classList.remove('active');
        }

        video.currentTime = currentTime;
        if (isPlaying) video.play();
    }

    function seekVideo(seconds) {
        video.currentTime = seconds;
        video.play();
    }
</script>

</body>
</html>
